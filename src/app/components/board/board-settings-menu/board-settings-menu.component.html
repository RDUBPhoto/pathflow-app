<aside class="ui-menu" hidden>
  <header class="ui-header">
    <div class="ui-toolbar">
      <h1 class="ui-title">Board Settings</h1>
    </div>
  </header>

  <div class="ui-content app-content no-vscroll" [class.ui-no-scroll]="true">
    <div class="ui-list">
      <div class="ui-item">
        <span class="ui-label">Add New lane</span>
        <ui-input aria-label="Add New lane"
          [ngModel]="newLane"
          (ngModelChange)="newLaneChange.emit($event)">
        </ui-input>
      </div>
      <div style="margin-top:8px;">
        <button class="btn ui-button btn-primary" type="button" (click)="addLane.emit()">Add</button>
      </div>
    </div>

    <div class="ui-list">
      <div class="ui-item">
        <span class="ui-label">Lane colors</span>
      </div>

      <div class="ui-item" *ngFor="let l of lanes">
        <span class="ui-label text-wrap">
          <div style="font-weight:600">{{ l.name }}</div>
        </span>

        <select class="form-select" aria-label="Lane colors"
          [ngModel]="getLaneColor(l.id)"
          (ngModelChange)="onPickColor(l.id, $event)">
          <option value="">None</option>
          <option *ngFor="let c of palette" [ngValue]="c.hex">
            {{ c.label }}
          </option>
        </select>
      </div>
    </div>
  </div>
</aside>
