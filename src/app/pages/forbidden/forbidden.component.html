<header class="ui-header app-header">
  <div class="ui-toolbar">
    <div class="ui-buttons" slot="start">
      <app-page-back-button></app-page-back-button>
    </div>
    <h1 class="ui-title">Access</h1>
    <app-company-switcher></app-company-switcher>
    <div slot="end" class="ui-buttons me-2">
      <app-user-menu></app-user-menu>
    </div>
  </div>
</header>

<div class="ui-content app-content forbidden-page app-padding">
  <div class="card ui-card app-surface forbidden-card">
    <div class="card-header ui-card-header">
      <h2 class="card-title ui-card-title">
        <ui-icon name="lock"></ui-icon>
        Access denied
      </h2>
    </div>
    <div class="card-body ui-card-content">
      <p>Your account does not currently have permission to access this page.</p>
      <div class="actions">
        <button class="btn ui-button btn-outline-primary" type="button" routerLink="/dashboard">Return to Dashboard</button>
        <button class="btn ui-button btn-danger" type="button" (click)="signOut()">Logout</button>
      </div>
    </div>
  </div>
</div>
